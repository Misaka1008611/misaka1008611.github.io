<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>玉溪智慧水务 · 监测设备部署点位图</title>
		<link rel="stylesheet" href="ol/ol.css" />
		<link rel="stylesheet" href="sol/sol.min.css" />
		<style>
			:root {
				--bg: #1a1d23;
				--panel-bg: rgba(22, 24, 30, 0.92);
				--panel-border: rgba(255, 255, 255, 0.08);
				--text: #e8e8ed;
				--text-secondary: #9ca3b0;
				--text-muted: #6b7280;
				--accent: #60a5fa;
				--accent-glow: rgba(96, 165, 250, 0.25);
				--danger: #f87171;
				--success: #4ade80;
				--warning: #fbbf24;
				--radius: 12px;
				--radius-sm: 8px;
				--blur: blur(16px);
				--shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--panel-border);
				--transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
				background: var(--bg);
				overflow: hidden;
			}
			#mapContainer {
				width: 100%;
				height: 100%;
			}

			/* ---- Title Bar ---- */
			.title-bar {
				position: absolute;
				top: 16px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 100;
				background: var(--panel-bg);
				backdrop-filter: var(--blur);
				-webkit-backdrop-filter: var(--blur);
				color: #fff;
				padding: 10px 32px;
				border-radius: 32px;
				font-size: 16px;
				font-weight: 600;
				letter-spacing: 1.5px;
				box-shadow: var(--shadow);
				pointer-events: none;
				white-space: nowrap;
				border: 1px solid var(--panel-border);
			}
			.title-bar .dot {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--success);
				margin-right: 8px;
				box-shadow: 0 0 8px var(--success);
				animation: pulse-dot 2s ease-in-out infinite;
			}
			@keyframes pulse-dot {
				0%,
				100% {
					box-shadow: 0 0 4px var(--success);
				}
				50% {
					box-shadow:
						0 0 14px var(--success),
						0 0 24px rgba(74, 222, 128, 0.4);
				}
			}
			.title-bar .sub {
				font-size: 11px;
				font-weight: 400;
				letter-spacing: 0;
				color: var(--text-secondary);
				display: block;
				text-align: center;
				margin-top: 2px;
			}

			/* ---- Layer Control Panel ---- */
			.layer-panel {
				position: absolute;
				top: 110px;
				right: 16px;
				z-index: 100;
				background: var(--panel-bg);
				backdrop-filter: var(--blur);
				-webkit-backdrop-filter: var(--blur);
				color: var(--text);
				border-radius: var(--radius);
				box-shadow: var(--shadow);
				width: 268px;
				font-size: 13px;
				overflow: hidden;
				border: 1px solid var(--panel-border);
				transition: box-shadow var(--transition);
			}
			.layer-panel:hover {
				box-shadow:
					0 12px 40px rgba(0, 0, 0, 0.55),
					0 0 0 1px rgba(255, 255, 255, 0.13);
			}
			.layer-panel-header {
				padding: 13px 18px;
				font-weight: 700;
				font-size: 13px;
				letter-spacing: 0.5px;
				cursor: pointer;
				display: flex;
				justify-content: space-between;
				align-items: center;
				user-select: none;
				color: #fff;
				transition: background var(--transition);
			}
			.layer-panel-header:hover {
				background: rgba(255, 255, 255, 0.03);
			}
			.layer-panel-header .icon-text {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.layer-panel-header .arrow {
				font-size: 10px;
				color: var(--text-muted);
				transition: transform 0.3s;
			}
			.layer-panel.collapsed .arrow {
				transform: rotate(-90deg);
			}
			.layer-panel.collapsed .layer-panel-body {
				display: none;
			}
			.layer-panel-body {
				max-height: calc(100vh - 240px);
				overflow-y: auto;
				scrollbar-width: thin;
				scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
			}

			.section-label {
				padding: 10px 18px 4px;
				font-size: 10px;
				color: var(--text-muted);
				text-transform: uppercase;
				letter-spacing: 1.5px;
				font-weight: 700;
			}
			.divider {
				border: none;
				border-top: 1px solid rgba(255, 255, 255, 0.06);
				margin: 6px 14px;
			}
			.basemap-row {
				padding: 6px 14px 10px;
				display: flex;
				gap: 8px;
			}
			.basemap-btn {
				flex: 1;
				padding: 9px 6px;
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 20px;
				background: transparent;
				color: var(--text-secondary);
				font-size: 12px;
				cursor: pointer;
				text-align: center;
				transition: all var(--transition);
				font-family: inherit;
				position: relative;
				overflow: hidden;
			}
			.basemap-btn:hover {
				border-color: rgba(255, 255, 255, 0.3);
				color: #fff;
			}
			.basemap-btn.active {
				background: var(--accent);
				color: #0f172a;
				border-color: var(--accent);
				font-weight: 700;
				box-shadow: 0 0 16px var(--accent-glow);
			}

			.layer-item {
				display: flex;
				align-items: center;
				padding: 7px 18px;
				cursor: pointer;
				transition: background 0.12s;
				user-select: none;
			}
			.layer-item:hover {
				background: rgba(255, 255, 255, 0.04);
			}
			.layer-item .dot-wrap {
				position: relative;
				width: 14px;
				height: 14px;
				margin-right: 10px;
				flex-shrink: 0;
			}
			.layer-item .color-dot {
				width: 12px;
				height: 12px;
				border-radius: 50%;
				position: absolute;
				top: 1px;
				left: 1px;
				border: 2px solid rgba(255, 255, 255, 0.25);
				transition: all var(--transition);
			}
			.layer-item .glow-ring {
				width: 14px;
				height: 14px;
				border-radius: 50%;
				position: absolute;
				top: 0;
				left: 0;
				opacity: 0;
				transition: opacity var(--transition);
			}
			.layer-item:not(.off):hover .glow-ring {
				opacity: 0.5;
			}
			.layer-item.off .color-dot {
				background: #3a3a44 !important;
				border-color: #3a3a44;
			}
			.layer-item.off .glow-ring {
				opacity: 0 !important;
			}
			.layer-item .label {
				flex: 1;
				font-size: 12.5px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				transition: color var(--transition);
			}
			.layer-item .count {
				font-size: 11px;
				color: var(--text-muted);
				margin-left: 8px;
				flex-shrink: 0;
				font-variant-numeric: tabular-nums;
			}
			.layer-item.off .label {
				color: #5a5a66;
			}
			.layer-item.off .count {
				color: #4a4a55;
			}

			.toggle-row {
				display: flex;
				gap: 6px;
				padding: 4px 18px 8px;
			}
			.toggle-btn {
				flex: 1;
				padding: 5px 8px;
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 14px;
				background: transparent;
				color: var(--text-secondary);
				font-size: 11px;
				cursor: pointer;
				text-align: center;
				transition: all var(--transition);
				font-family: inherit;
			}
			.toggle-btn:hover {
				border-color: rgba(255, 255, 255, 0.3);
				color: #fff;
			}

			/* ---- Custom Tooltip (mouseMoveCall) ---- */
			.custom-tooltip {
				position: absolute;
				z-index: 200;
				pointer-events: none;
				opacity: 0;
				transform: translate(-50%, calc(-100% - 18px));
				transition: opacity 0.15s ease;
				background: rgba(15, 15, 22, 0.94);
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px);
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: var(--radius-sm);
				padding: 12px 16px;
				min-width: 200px;
				max-width: 300px;
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
			}
			.custom-tooltip.visible {
				opacity: 1;
			}
			.custom-tooltip::after {
				content: '';
				position: absolute;
				bottom: -6px;
				left: 50%;
				transform: translateX(-50%) rotate(45deg);
				width: 10px;
				height: 10px;
				background: rgba(15, 15, 22, 0.94);
				border-right: 1px solid rgba(255, 255, 255, 0.12);
				border-bottom: 1px solid rgba(255, 255, 255, 0.12);
			}
			.custom-tooltip .tt-type {
				font-size: 10px;
				letter-spacing: 1.5px;
				color: var(--accent);
				font-weight: 700;
				margin-bottom: 4px;
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.custom-tooltip .tt-type .tt-dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				display: inline-block;
			}
			.custom-tooltip .tt-name {
				font-size: 13px;
				font-weight: 700;
				color: #fff;
				margin-bottom: 6px;
				line-height: 1.3;
			}
			.custom-tooltip .tt-row {
				display: flex;
				gap: 6px;
				font-size: 11px;
				color: var(--text-secondary);
				margin: 2px 0;
				line-height: 1.4;
			}
			.custom-tooltip .tt-row .tt-key {
				color: var(--text-muted);
				flex-shrink: 0;
			}
			.custom-tooltip .tt-row .tt-val {
				color: #cbd5e1;
			}

			/* ---- Legend ---- */
			.legend-popup {
				position: absolute;
				bottom: 56px;
				right: 16px;
				z-index: 100;
				background: var(--panel-bg);
				backdrop-filter: var(--blur);
				-webkit-backdrop-filter: var(--blur);
				color: var(--text);
				border-radius: var(--radius);
				box-shadow: var(--shadow);
				padding: 14px 18px;
				font-size: 12px;
				display: none;
				border: 1px solid var(--panel-border);
				min-width: 200px;
			}
			.legend-popup.show {
				display: block;
				animation: fadeUp 0.2s ease;
			}
			@keyframes fadeUp {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			.legend-popup .legend-title {
				font-size: 10px;
				letter-spacing: 1.5px;
				color: var(--text-muted);
				margin-bottom: 8px;
				font-weight: 700;
			}
			.legend-row {
				display: flex;
				align-items: center;
				margin: 5px 0;
				gap: 8px;
			}
			.legend-dot {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				flex-shrink: 0;
			}
			.legend-count {
				color: var(--text-muted);
				font-size: 11px;
				margin-left: auto;
			}

			.legend-btn {
				position: absolute;
				bottom: 16px;
				right: 16px;
				z-index: 100;
				background: var(--panel-bg);
				backdrop-filter: var(--blur);
				-webkit-backdrop-filter: var(--blur);
				color: #fff;
				border: 1px solid var(--panel-border);
				border-radius: 24px;
				padding: 9px 18px;
				font-size: 12px;
				cursor: pointer;
				box-shadow: var(--shadow);
				font-family: inherit;
				transition: all var(--transition);
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.legend-btn:hover {
				border-color: rgba(255, 255, 255, 0.3);
				box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
			}

			/* ---- Pick Coordinate Button ---- */
			.pick-btn {
				position: absolute;
				bottom: 16px;
				right: 16px;
				z-index: 100;
				background: var(--panel-bg);
				backdrop-filter: var(--blur);
				-webkit-backdrop-filter: var(--blur);
				color: #fff;
				border: 1px solid var(--panel-border);
				border-radius: 24px;
				padding: 9px 18px;
				font-size: 12px;
				cursor: pointer;
				box-shadow: var(--shadow);
				font-family: inherit;
				transition: all var(--transition);
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.pick-btn:hover {
				border-color: rgba(255, 255, 255, 0.3);
				box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
			}
			.pick-btn.active {
				background: var(--accent);
				color: #0f172a;
				border-color: var(--accent);
				font-weight: 700;
				box-shadow: 0 0 20px var(--accent-glow);
				animation: pulse-pick 1.8s ease-in-out infinite;
			}
			@keyframes pulse-pick {
				0%,
				100% {
					box-shadow: 0 0 16px var(--accent-glow);
				}
				50% {
					box-shadow:
						0 0 32px rgba(96, 165, 250, 0.5),
						0 0 48px rgba(96, 165, 250, 0.2);
				}
			}

			/* ---- Pick Mode Indicator Bar ---- */
			.pick-indicator {
				position: absolute;
				bottom: 80px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 200;
				background: rgba(15, 15, 22, 0.92);
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px);
				border: 1px solid var(--accent);
				border-radius: 24px;
				padding: 10px 24px;
				display: flex;
				align-items: center;
				gap: 12px;
				color: #fff;
				font-size: 13px;
				font-family: inherit;
				box-shadow:
					0 0 24px var(--accent-glow),
					0 8px 32px rgba(0, 0, 0, 0.5);
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.2s ease;
				white-space: nowrap;
			}
			.pick-indicator.active {
				opacity: 1;
			}
			.pick-indicator .pick-label {
				color: var(--accent);
				font-size: 18px;
			}
			.pick-indicator .pick-coords {
				font-variant-numeric: tabular-nums;
				letter-spacing: 0.5px;
				color: #e2e8f0;
			}
			.pick-indicator .pick-hint {
				font-size: 10px;
				color: var(--text-muted);
				margin-left: 8px;
				padding-left: 10px;
				border-left: 1px solid rgba(255, 255, 255, 0.12);
			}

			/* ---- Toast Notification ---- */
			.toast {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%) scale(0.9);
				z-index: 300;
				background: var(--success);
				color: #0f172a;
				font-weight: 700;
				font-size: 14px;
				padding: 10px 24px;
				border-radius: 24px;
				box-shadow: 0 4px 20px rgba(74, 222, 128, 0.4);
				opacity: 0;
				pointer-events: none;
				transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
				font-family: inherit;
			}
			.toast.show {
				opacity: 1;
				transform: translate(-50%, -50%) scale(1);
			}

			/* ---- Drag Sub-Mode Bar ---- */
			.drag-bar {
				position: absolute;
				bottom: 80px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 200;
				background: rgba(15, 15, 22, 0.92);
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px);
				border: 1px solid var(--warning);
				border-radius: 24px;
				padding: 10px 24px;
				display: none;
				align-items: center;
				gap: 12px;
				color: #fff;
				font-size: 13px;
				font-family: inherit;
				box-shadow:
					0 0 24px rgba(251, 191, 36, 0.3),
					0 8px 32px rgba(0, 0, 0, 0.5);
				white-space: nowrap;
			}
			.drag-bar.visible {
				display: flex;
			}
			.drag-bar .drag-label {
				color: var(--warning);
				font-weight: 700;
			}
			.drag-bar .drag-hint {
				font-size: 10px;
				color: var(--text-muted);
			}

			/* ---- Edit Panel (Left Side) ---- */
			.edit-panel {
				position: absolute;
				top: 110px;
				left: 16px;
				z-index: 100;
				background: var(--panel-bg);
				backdrop-filter: var(--blur);
				-webkit-backdrop-filter: var(--blur);
				color: var(--text);
				border-radius: var(--radius);
				box-shadow: var(--shadow);
				width: 320px;
				font-size: 13px;
				overflow: hidden;
				border: 1px solid var(--panel-border);
				transition: all var(--transition);
				display: none;
			}
			.edit-panel.visible {
				display: block;
				animation: fadeUp 0.2s ease;
			}
			.edit-panel-header {
				padding: 13px 18px;
				font-weight: 700;
				font-size: 13px;
				letter-spacing: 0.5px;
				cursor: pointer;
				display: flex;
				justify-content: space-between;
				align-items: center;
				user-select: none;
				color: #fff;
				transition: background var(--transition);
			}
			.edit-panel-header:hover {
				background: rgba(255, 255, 255, 0.03);
			}
			.edit-panel-header .arrow {
				font-size: 10px;
				color: var(--text-muted);
				transition: transform 0.3s;
			}
			.edit-panel.collapsed .arrow {
				transform: rotate(-90deg);
			}
			.edit-panel.collapsed .edit-panel-body {
				display: none;
			}
			.edit-panel-body {
				max-height: calc(100vh - 280px);
				overflow-y: auto;
				scrollbar-width: thin;
				scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
			}

			/* ---- History Banner ---- */
			.history-banner {
				margin: 8px 14px;
				padding: 10px 14px;
				background: rgba(251, 191, 36, 0.12);
				border: 1px solid rgba(251, 191, 36, 0.3);
				border-radius: var(--radius-sm);
				font-size: 12px;
				color: var(--warning);
				display: none;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
			}
			.history-banner.visible {
				display: flex;
			}
			.history-banner .banner-text {
				flex: 1;
				min-width: 140px;
			}
			.history-banner .banner-btn {
				padding: 4px 12px;
				border: 1px solid var(--warning);
				border-radius: 14px;
				background: transparent;
				color: var(--warning);
				font-size: 11px;
				cursor: pointer;
				font-family: inherit;
				transition: all var(--transition);
				white-space: nowrap;
			}
			.history-banner .banner-btn:hover {
				background: var(--warning);
				color: #0f172a;
			}

			/* ---- Selected Point Info ---- */
			.selected-info {
				padding: 0 18px 12px;
				display: none;
			}
			.selected-info.visible {
				display: block;
			}
			.selected-info .sel-title {
				font-size: 10px;
				letter-spacing: 1.5px;
				color: var(--text-muted);
				font-weight: 700;
				margin-bottom: 8px;
				text-transform: uppercase;
			}
			.selected-info .sel-row {
				display: flex;
				gap: 6px;
				font-size: 11.5px;
				margin: 3px 0;
				line-height: 1.5;
			}
			.selected-info .sel-key {
				color: var(--text-muted);
				flex-shrink: 0;
				min-width: 36px;
			}
			.selected-info .sel-val {
				color: #cbd5e1;
				word-break: break-all;
			}
			.selected-info .sel-actions {
				display: flex;
				gap: 8px;
				margin-top: 10px;
			}

			/* ---- Button Variants ---- */
			.btn-primary {
				padding: 7px 16px;
				border: none;
				border-radius: 16px;
				background: var(--accent);
				color: #0f172a;
				font-size: 12px;
				font-weight: 700;
				cursor: pointer;
				font-family: inherit;
				transition: all var(--transition);
			}
			.btn-primary:hover {
				box-shadow: 0 0 16px var(--accent-glow);
				transform: translateY(-1px);
			}
			.btn-danger {
				padding: 7px 16px;
				border: none;
				border-radius: 16px;
				background: var(--danger);
				color: #fff;
				font-size: 12px;
				font-weight: 700;
				cursor: pointer;
				font-family: inherit;
				transition: all var(--transition);
			}

				/**

				function showTooltip(feature, evt) {
					var dataStr = feature.get('data')
					var props
					try {
						props = JSON.parse(dataStr)
					} catch (e) {
						props = {}
					}
					var typeName = props.Type || ''
					var colors = TYPE_COLORS[typeName]
					var dotColor = colors ? colors.fill : '#888'

					var html = ''
					html += "<div class='tt-type'>"
					html += "<span class='tt-dot' style='background:" + dotColor + "'></span>"
					html += typeName + ' &nbsp;·&nbsp; #' + props.ID
					html += '</div>'
					html += "<div class='tt-name'>" + (props.Name || '') + '</div>'
					if (props.Dept) {
						html += "<div class='tt-row'><span class='tt-key'>管理所</span>"
						html += "<span class='tt-val'>" + props.Dept + '</span></div>'
					}
					if (props.Location) {
						html += "<div class='tt-row'><span class='tt-key'>位置</span>"
						html += "<span class='tt-val'>" + props.Location + '</span></div>'
					}
					html += "<div class='tt-row'><span class='tt-key'>通讯</span>"
					html += "<span class='tt-val'>" + (props.Comm || '') + '</span></div>'
					html += "<div class='tt-row'><span class='tt-key'>供电</span>"
					html += "<span class='tt-val'>" + (props.Power || '') + '</span></div>'
					html += "<div class='tt-row'><span class='tt-key'>坐标</span>"
					html += "<span class='tt-val'>" + props.Lon.toFixed(5) + ', ' + props.Lat.toFixed(5) + '</span></div>'

					tooltipEl.innerHTML = html
					tooltipEl.classList.add('visible')
					tooltipEl.style.left = evt.pixel[0] + 'px'
					tooltipEl.style.top = evt.pixel[1] + 'px'

				}

					// Left-click to copy and exit
					pickMapClickKey = olMap.on('click', function (evt) {
						var coord = evt.coordinate
						var text = coord[0].toFixed(6) + ', ' + coord[1].toFixed(6)
						if (navigator.clipboard && navigator.clipboard.writeText) {
							navigator.clipboard
								.writeText(text)
								.then(function () {
									showToast('✅ 已复制: ' + text)
								})
								.catch(function () {
									fallbackCopy(text)
								})
						} else {
							fallbackCopy(text)
						}
						exitPickMode()
					})

					// Esc key to cancel

						if (e.key === 'Escape') {

					var ta = document.createElement('textarea')

					document.body.appendChild(ta)

				// ================================================================
				//  Version Management — file-based, upload/download .js files
				// ================================================================

				/** Deep clone via JSON */
				function deepClone(obj) {
					return JSON.parse(JSON.stringify(obj))
				}

				/** The working data — all edit operations modify this directly.
				 *  Initialized from point_data.js, may be overridden by versions.json */
				var currentWorkingData = deepClone(pointData)

				/** Version index loaded from web_data/versions.json */
				var versionIndex = null
				var currentVersionId = 1

				/** Load versions.json and set up the version list */
				function loadVersionIndex(callback) {
					// Build version index from default + cached uploads
					versionIndex = { currentId: 1, versions: [{ id: 1, file: 'point_data.js', label: '初始数据 (point_data.js)', timestamp: '-', points: countTotalPoints(pointData) }] }
					// Merge cached uploaded versions from localStorage
					try {
						var cached = localStorage.getItem('yuxi_uploaded_index')
						if (cached) {
							var cIdx = JSON.parse(cached)
							if (cIdx && cIdx.versions) {
								for (var ci = 0; ci < cIdx.versions.length; ci++) {
									var cv = cIdx.versions[ci]
									var exists = false
									for (var cj = 0; cj < versionIndex.versions.length; cj++) {
										if (versionIndex.versions[cj].file === cv.file) { exists = true; break }
									}
									if (!exists) versionIndex.versions.push(cv)
								}
								currentVersionId = cIdx.currentId || 1
								versionIndex.currentId = currentVersionId
								// Load current version data from cache if it's an uploaded file
								var dataText = localStorage.getItem('yuxi_uploaded_data_' + currentVersionId)
								if (dataText) {
									try {
										var match = dataText.match(/=\s*(\{[\s\S]*\})\s*;?\s*$/)
										if (match) {
											currentWorkingData = JSON.parse(match[1])
										} else {
											var fn = new Function('return ' + dataText.replace(/^var\s+\w+\s*=\s*/, '').replace(/;\s*$/, ''))
											currentWorkingData = fn()
										}
									} catch (e) {}
								}
							}
						}
					} catch (e) { console.warn('恢复上传版本缓存失败', e) }
					if (callback) callback()
				}

				/** Find a version entry by id */
				function findVersionById(id) {
					if (!versionIndex || !versionIndex.versions) return null
					for (var i = 0; i < versionIndex.versions.length; i++) {
						if (versionIndex.versions[i].id === id) return versionIndex.versions[i]
					}
					return null
				}

				/** Fetch and parse a version data file */
				function loadVersionDataFile(filename, callback) {
					var xhr = new XMLHttpRequest()
					xhr.open('GET', 'web_data/' + filename + '?t=' + Date.now(), true)
					xhr.onload = function () {
						if (xhr.status === 200) {
							try {
								var text = xhr.responseText
								// Extract JSON object from "var pointData = {...}" or similar
								var match = text.match(/=\s*(\{[\s\S]*\})\s*;?\s*$/)
								if (match) {
									var data = JSON.parse(match[1])
									callback(data)
									return
								}
								// Try evaluating as JavaScript
								var fn = new Function('return ' + text.replace(/^var\s+\w+\s*=\s*/, '').replace(/;\s*$/, ''))
								callback(fn())
								return
							} catch (e) {
								console.error('版本文件解析失败: ' + filename, e)
							}
						}
						callback(null)
					}
					xhr.onerror = function () { callback(null) }
					xhr.send()
				}

				/** Get current data (working copy) */
				function getCurrentData() {
					return currentWorkingData
				}

				/** Get data at a specific version (by fetching the file if needed) */
				function getDataAtVersionAsync(versionId, callback) {
					if (versionId === 1) {
						callback(deepClone(pointData))
						return
					}
					var v = findVersionById(versionId)
					if (!v) { callback(null); return }
					loadVersionDataFile(v.file, function (data) {
						callback(data || currentWorkingData)
					})
				}

				/** Find the maximum point ID across data */
				function getNextPointId() {
					var maxId = 0
					Object.keys(currentWorkingData).forEach(function (typeName) {
						(currentWorkingData[typeName] || []).forEach(function (p) {
							if (p.ID > maxId) maxId = p.ID
						})
					})
					return maxId + 1
				}

				/** Count total points in a data object */
				function countTotalPoints(data) {
					var count = 0
					Object.keys(data).forEach(function (t) { count += (data[t] || []).length })
					return count
				}

				/** Generate file content for a version data file */
				function generateVersionFileContent() {
					return '// Monitoring device deployment points\n' +
						'// CRS: WGS84 (EPSG:4326)\n' +
						'// Auto-generated from edit session\n' +
						'var pointData = ' + JSON.stringify(currentWorkingData, null, 2) + ';\n'
				}

				/** Trigger a file download in the browser */
				function downloadFile(filename, content, mimeType) {
					var blob = new Blob([content], { type: mimeType || 'application/javascript' })
					var url = URL.createObjectURL(blob)
					var a = document.createElement('a')
					a.href = url
					a.download = filename
					document.body.appendChild(a)
					a.click()
					document.body.removeChild(a)
					URL.revokeObjectURL(url)
				}

				/** Save: generate and download files, update version index in memory */
				function saveToFiles(sessionName) {
					if (!versionIndex) {
						versionIndex = { currentId: 1, versions: [{ id: 1, file: 'point_data.js', label: '初始数据 (point_data.js)', timestamp: '-', points: countTotalPoints(pointData) }] }
					}

					var now = new Date()
					var ts = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '_' +
						String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0')
					var newFile = 'point_data_' + ts + '.js'
					var timestamp = now.getFullYear() + '-' +
						String(now.getMonth()+1).padStart(2,'0') + '-' +
						String(now.getDate()).padStart(2,'0') + ' ' +
						String(now.getHours()).padStart(2,'0') + ':' +
						String(now.getMinutes()).padStart(2,'0')

					var newId = versionIndex.versions.length + 1
					versionIndex.versions.push({
						id: newId,
						file: newFile,
						label: sessionName,
						timestamp: timestamp,
						points: countTotalPoints(currentWorkingData)
					})
					versionIndex.currentId = newId
					currentVersionId = newId

					// Download ONLY the data JS file
					var dataContent = generateVersionFileContent()
					downloadFile(newFile, dataContent)

					// Cache uploaded version in localStorage so it persists
					try {
						localStorage.setItem('yuxi_uploaded_data_' + newId, dataContent)
						localStorage.setItem('yuxi_uploaded_index', JSON.stringify(versionIndex))
					} catch (e) {}

					// Update UI
					renderVersionHistory()
					updateLayerListUI()

					return newId
				}

				/** Upload a version .js file from local disk */
				function uploadVersionFile(file) {
					var reader = new FileReader()
					reader.onload = function (e) {
						try {
							var text = e.target.result
							var match = text.match(/=\s*(\{[\s\S]*\})\s*;?\s*$/)
							var data
							if (match) {
								data = JSON.parse(match[1])
							} else {
								var fn = new Function('return ' + text.replace(/^var\s+\w+\s*=\s*/, '').replace(/;\s*$/, ''))
								data = fn()
							}
							if (!data || typeof data !== 'object') {
								showToastMsg('⚠ 文件格式无效', true)
								return
							}
							if (!versionIndex) {
								versionIndex = { currentId: 1, versions: [{ id: 1, file: 'point_data.js', label: '初始数据 (point_data.js)', timestamp: '-', points: countTotalPoints(pointData) }] }
							}
							var newId = versionIndex.versions.length + 1
							var now = new Date()
							var timestamp = now.getFullYear() + '-' +
								String(now.getMonth()+1).padStart(2,'0') + '-' +
								String(now.getDate()).padStart(2,'0') + ' ' +
								String(now.getHours()).padStart(2,'0') + ':' +
								String(now.getMinutes()).padStart(2,'0')
							versionIndex.versions.push({
								id: newId,
								file: file.name,
								label: file.name,
								timestamp: timestamp,
								points: countTotalPoints(data)
							})
							versionIndex.currentId = newId
							currentVersionId = newId
							currentWorkingData = data
							// Cache in localStorage
							try {
								localStorage.setItem('yuxi_uploaded_data_' + newId, text)
								localStorage.setItem('yuxi_uploaded_index', JSON.stringify(versionIndex))
							} catch (e2) {}
							refreshAllLayers()
							renderVersionHistory()
							updateLayerListUI()
							showToastMsg('✅ 已加载：' + file.name + ' (V' + newId + ')')
						} catch (e3) {
							console.error('上传解析失败', e3)
							showToastMsg('⚠ 解析失败：' + e3.message, true)
						}
					}
					reader.readAsText(file)
				}

					}),

				// Create a Translate interaction for dragging selected points
				// It operates on the highlight layer's features
				var translateFeatures = new ol.Collection()

				// Track whether the feature actually moved during drag
				var dragMoved = false

				translateInteraction.on('translatestart', function (evt) {
					dragMoved = false
					var feat = evt.features.item(0)
					var geom = feat.getGeometry()
					var coords = geom.getCoordinates()
					feat.set('_origLon', coords[0])
					feat.set('_origLat', coords[1])
					olMap.getViewport().style.cursor = 'grabbing'
				})

				translateInteraction.on('translating', function (evt) {
					dragMoved = true
					var feat = evt.features.item(0)
					var geom = feat.getGeometry()
					var coords = geom.getCoordinates()
					// Update selected point coords and refresh the panel in real-time
					if (selectedPoint) {
						selectedPoint.point.Lon = coords[0]
						selectedPoint.point.Lat = coords[1]
						refreshSelectedInfoDisplay()
					}
				})

				translateInteraction.on('translateend', function (evt) {
					olMap.getViewport().style.cursor = 'crosshair'
					if (!dragMoved || !selectedPoint) return

					var feat = evt.features.item(0)
					var geom = feat.getGeometry()
					var coords = geom.getCoordinates()
					var newLon = coords[0]
					var newLat = coords[1]
					var origLon = feat.get('_origLon')
					var origLat = feat.get('_origLat')

					// If in drag sub-mode, just update the point position in memory (no commit)
					if (dragSubMode) {
						if (Math.abs(newLon - origLon) < 0.000001 && Math.abs(newLat - origLat) < 0.000001) {
							// Moved back to original — revert highlight
							showHighlight(dragOriginalCoords[0], dragOriginalCoords[1])
							selectedPoint.point.Lon = dragOriginalCoords[0]
							selectedPoint.point.Lat = dragOriginalCoords[1]
							refreshSelectedInfoDisplay()
						} else {
							// Update the in-memory point
							selectedPoint.point.Lon = newLon
							selectedPoint.point.Lat = newLat
							refreshSelectedInfoDisplay()
						}
						return
					}

					// Legacy: if somehow dragged outside sub-mode, revert to original
					showHighlight(origLon, origLat)
					selectedPoint.point.Lon = origLon
					selectedPoint.point.Lat = origLat
					refreshSelectedInfoDisplay()
				})

				// ================================================================
				//  Enter / Exit Edit Mode
				// ================================================================

			function enterEditMode() {
				if (pickActive) exitPickMode()

				// Auto-generate session name from timestamp
				var now = new Date()
				editSessionName =
					now.getFullYear() + "-" +
					String(now.getMonth() + 1).padStart(2, "0") + "-" +
					String(now.getDate()).padStart(2, "0") + " " +
					String(now.getHours()).padStart(2, "0") + ":" +
					String(now.getMinutes()).padStart(2, "0")
				editSessionSnapshot = deepClone(currentWorkingData)
				editSessionSaved = false

				editMode = true
				btnStartEdit.textContent = "✏️ 结束编辑"
				btnStartEdit.classList.add("active")
				olMap.getViewport().style.cursor = "crosshair"

				// Show edit controls
				document.getElementById("addPointBtn").style.display = "block"

				editClickKey = olMap.on("click", onEditMapClick)

				updateEditPanelHeader()
				renderVersionHistory()
			}

			function exitEditMode(forceDiscard) {
				// Check for unsaved changes
				if (!forceDiscard && !editSessionSaved && editSessionSnapshot) {
					var hasChanges = JSON.stringify(currentWorkingData) !== JSON.stringify(editSessionSnapshot)
					if (hasChanges) {
						var choice = confirm("有未保存的编辑内容。\\n\\n\"确定\" = 保存并退出\\n\"取消\" = 继续编辑")
						if (choice) {
							saveEditSession()
						} else {
							return
						}
					}
				}

				editMode = false
				btnStartEdit.textContent = "✏️ 编辑"
				btnStartEdit.classList.remove("active")
				olMap.getViewport().style.cursor = ""
				clearSelection()
				exitDragSubMode()

				// Hide edit controls
				document.getElementById("addPointBtn").style.display = "none"
				selectedInfo.classList.remove("visible")

				if (editClickKey !== null) {
					ol.Observable.unByKey(editClickKey)
					editClickKey = null
				}

				if (viewedVersionId !== null) {
					restoreCurrentVersion()
				}

				editSessionName = ""
				editSessionSnapshot = null
				editSessionSaved = false
				updateEditPanelHeader()
			}

				function saveEditSession() {
					if (!editSessionName || editSessionSaved) return
					var newId = saveToFiles(editSessionName)
					var newFile = versionIndex ? versionIndex.versions[versionIndex.versions.length-1].file : 'unknown.js'
					editSessionSaved = true
					editSessionSnapshot = deepClone(currentWorkingData)
					refreshAllLayers()
					updateEditPanelHeader()
					showToastMsg("✅ 已保存：" + editSessionName + " —— 请将下载的 " + newFile + " 放入 web_data/ 文件夹")
				}

				function discardEditSession() {
					if (!editSessionSnapshot) return
					currentWorkingData = deepClone(editSessionSnapshot)
					editSessionSaved = false
					refreshAllLayers()
					clearSelection()
					renderVersionHistory()
					updateLayerListUI()
					updateEditPanelHeader()
					showToastMsg('已放弃本次编辑内容')
				}

				function updateEditPanelHeader() {
					var headerSpan = editPanelToggle.querySelector('span:first-child')
					if (!headerSpan) return
					if (editMode && editSessionName) {
						headerSpan.innerHTML =
							'✏️ 编辑：' +
							editSessionName +
							(editSessionSaved ? ' <span style="color:var(--success);font-size:10px">已保存</span>' : ' <span style="color:var(--warning);font-size:10px">未保存</span>')
						btnSaveSession.style.display = editSessionSaved ? 'none' : 'inline-block'
						btnDiscardSession.style.display = 'inline-block'
					} else {
						headerSpan.textContent = '✏️ 编辑模式'
						btnSaveSession.style.display = 'none'
						btnDiscardSession.style.display = 'none'
					}
				}

				// ---- Drag Sub-Mode ----
				function enterDragSubMode() {
					if (!selectedPoint || viewedVersionId !== null) return
					dragSubMode = true
					editClickKey && ol.Observable.unByKey(editClickKey)
					editClickKey = null
					dragOriginalCoords = [selectedPoint.point.Lon, selectedPoint.point.Lat]
					document.getElementById('dragBar').classList.add('visible')
					// Disable edit/delete buttons during drag
					btnEditPoint.disabled = true
					btnDeletePoint.disabled = true
					var moveBtn = document.getElementById('btnMovePoint')
					if (moveBtn) moveBtn.textContent = '📍 拖动中…'
				}

				function exitDragSubMode() {
					dragSubMode = false
					dragOriginalCoords = null
					document.getElementById('dragBar').classList.remove('visible')
					btnEditPoint.disabled = false
					btnDeletePoint.disabled = false
					var moveBtn = document.getElementById('btnMovePoint')
					if (moveBtn) moveBtn.textContent = '📍 调整位置'
					// Re-bind edit click
					if (editMode) {
						editClickKey = olMap.on('click', onEditMapClick)
					}
				}

				function confirmDragPosition() {
					if (!selectedPoint) return
					var point = selectedPoint.point
					var typeName = selectedPoint.typeName
					// Update working data with new position
					var arr = currentWorkingData[typeName]
					if (arr) {
						for (var di = 0; di < arr.length; di++) {
							if (arr[di].ID === point.ID) {
								arr[di].Lon = point.Lon
								arr[di].Lat = point.Lat
								break
							}
						}
					}
					refreshLayerByType(typeName)
					selectPoint(typeName, point, null)
					editSessionSaved = false
					updateEditPanelHeader()
					showToastMsg('📍 位置已更新（尚未保存到版本）')
					exitDragSubMode()
				}

				function cancelDragPosition() {
					if (!selectedPoint || !dragOriginalCoords) return
					// Restore original position
					selectedPoint.point.Lon = dragOriginalCoords[0]
					selectedPoint.point.Lat = dragOriginalCoords[1]
					refreshLayerByType(selectedPoint.typeName)
					selectPoint(selectedPoint.typeName, selectedPoint.point, null)
					exitDragSubMode()
				}

				// Drag bar buttons
				document.getElementById('dragConfirm').addEventListener('click', confirmDragPosition)
				document.getElementById('dragCancel').addEventListener('click', cancelDragPosition)

				// ================================================================

				function onEditMapClick(evt) {
					if (viewedVersionId !== null) {
						showToastMsg('⚠ 正在查看历史版本，请先点击"返回当前版本"', true)
						return
					}

					var feature = olMap.forEachFeatureAtPixel(evt.pixel, function (feat, layer) {
						if (layer === highlightLayer) return null
						if (layer === boundaryLayer) return null
							if (layer === townshipLayer) return null
						if (feat.get('data')) return feat
						return null
					})

					if (feature) {
						var dataStr = feature.get('data')
						var props
						try {
							props = JSON.parse(dataStr)
						} catch (e) {
							props = {}
						}
						selectPoint(props.Type, props, feature)
					} else {
						clearSelection()
						openAddForm(evt.coordinate[0], evt.coordinate[1])
					}
				}

				// ================================================================
				//  Point Selection
				// ================================================================

				function selectPoint(typeName, point, feature) {
					selectedPoint = { typeName: typeName, point: point }
					selectedFeature = feature
					selectedInfo.classList.add('visible')

					var colors = TYPE_COLORS[typeName]
					var dotColor = colors ? colors.fill : '#888'
					var html = ''
					html +=
						"<div class='sel-row'><span class='sel-key'>类型</span><span class='sel-val'>" +
						"<span style='display:inline-block;width:8px;height:8px;border-radius:50%;background:" +
						dotColor +
						";margin-right:4px;vertical-align:middle'></span>" +
						typeName +
						' &nbsp;·&nbsp; #' +
						point.ID +
						'</span></div>'
					html += "<div class='sel-row'><span class='sel-key'>名称</span><span class='sel-val'>" + (point.Name || '') + '</span></div>'
					if (point.Dept) html += "<div class='sel-row'><span class='sel-key'>管理所</span><span class='sel-val'>" + point.Dept + '</span></div>'
					if (point.Location) html += "<div class='sel-row'><span class='sel-key'>位置</span><span class='sel-val'>" + point.Location + '</span></div>'
					html += "<div class='sel-row'><span class='sel-key'>坐标</span><span class='sel-val'>" + point.Lon.toFixed(5) + ', ' + point.Lat.toFixed(5) + '</span></div>'
					if (point.Power) html += "<div class='sel-row'><span class='sel-key'>供电</span><span class='sel-val'>" + point.Power + '</span></div>'
					if (point.Comm) html += "<div class='sel-row'><span class='sel-key'>通讯</span><span class='sel-val'>" + point.Comm + '</span></div>'
					if (point.Remark) html += "<div class='sel-row'><span class='sel-key'>备注</span><span class='sel-val'>" + point.Remark + '</span></div>'

					selectedDetails.innerHTML = html
					showHighlight(point.Lon, point.Lat)

					// Activate drag on the highlight feature
					if (translateInteraction) {
						translateFeatures.clear()
						var hf = highlightLayer.getSource().getFeatures()
						if (hf.length > 0) {
							translateFeatures.push(hf[0])
							translateInteraction.setActive(true)
						}
					}
				}

				function clearSelection() {
					selectedPoint = null
					selectedFeature = null
					selectedInfo.classList.remove('visible')
					selectedDetails.innerHTML = ''
					// Deactivate drag
					if (translateInteraction) {
						translateInteraction.setActive(false)
						translateFeatures.clear()
					}
					hideHighlight()
				}

				// ================================================================

				function showHighlight(lon, lat) {
					hideHighlight()
					var feat = new ol.Feature({
						geometry: new ol.geom.Point([lon, lat]),
					})
					highlightLayer.getSource().addFeature(feat)
				}

				function hideHighlight() {
					highlightLayer.getSource().clear()
				}

				/** Refresh only the coordinate line in the selected-info panel during drag */
				function refreshSelectedInfoDisplay() {
					if (!selectedPoint) return
					var p = selectedPoint.point
					var rows = selectedDetails.querySelectorAll('.sel-row')
					for (var i = 0; i < rows.length; i++) {
						var keyEl = rows[i].querySelector('.sel-key')
						if (keyEl && keyEl.textContent === '坐标') {
							var valEl = rows[i].querySelector('.sel-val')
							if (valEl) {
								valEl.textContent = p.Lon.toFixed(5) + ', ' + p.Lat.toFixed(5)
							}
							break
						}
					}
				}

				// ================================================================
				//  Layer Refresh
				// ================================================================

				function refreshLayerByType(typeName) {
					var oldLayer = allLayers[typeName]
					var wasVisible = oldLayer ? oldLayer.getVisible() : true

					if (oldLayer) {
						sMap.removeLayer(oldLayer)
					}

					var currentData = getCurrentData()
					var points = currentData[typeName] || []

					var newLayer = new sol.SimplePointFeatureLayer({
						id: 'lyr_' + typeName,
						data: points,
						dataType: sol.global.featureTypes.point,
						sourceType: 'json',
						dataLngName: 'Lon',
						dataLatName: 'Lat',
						styleFn: makePointStyle,
						declutter: 'separate',
						renderBuffer: 30,
						visible: wasVisible,
					})

					sMap.addLayer(newLayer)
					allLayers[typeName] = newLayer
					layerVisible[typeName] = wasVisible

					var item = layerListEl.querySelector("[data-type='" + typeName + "']")
					if (item) {
						if (wasVisible) item.classList.remove('off')
						else item.classList.add('off')
					}
				}

				function refreshAllLayers() {
					typeNames.forEach(function (tn) {
						refreshLayerByType(tn)
					})
				}

					formPower.value = ''
					formComm.value = ''
					formCond.value = ''
					formRemark.value = ''
					clearFormErrors()
				}

				function openAddForm(lon, lat) {
					if (viewedVersionId !== null) {
						showToastMsg('⚠ 请先返回当前版本', true)
						return
					}
					editingPointId = null
					editingPointType = null
					resetForm()
					modalTitle.textContent = '➕ 添加点位'
					formLon.value = lon.toFixed(6)
					formLat.value = lat.toFixed(6)
					modalOverlay.classList.add('visible')
					setTimeout(function () {
						formName.focus()
					}, 150)
				}

				function openEditForm(typeName, point) {
					if (viewedVersionId !== null) {
						showToastMsg('⚠ 请先返回当前版本', true)
						return
					}
					editingPointId = point.ID
					editingPointType = typeName
					resetForm()
					modalTitle.textContent = '✎ 编辑点位 #' + point.ID
					formType.value = typeName
					formName.value = point.Name || ''
					formDept.value = point.Dept || ''
					formLocation.value = point.Location || ''
					formLon.value = point.Lon
					formLat.value = point.Lat
					formQty.value = point.Qty != null ? point.Qty : 1
					formPower.value = point.Power || ''
					formComm.value = point.Comm || ''
					formCond.value = point.Cond || ''
					formRemark.value = point.Remark || ''
					modalOverlay.classList.add('visible')
					setTimeout(function () {
						formName.focus()
					}, 150)
				}

				function closeModal() {
					modalOverlay.classList.remove('visible')
					editingPointId = null
					editingPointType = null
				}

				modalClose.addEventListener('click', closeModal)
				modalCancel.addEventListener('click', closeModal)

				modalOverlay.addEventListener('click', function (e) {
					if (e.target === modalOverlay) closeModal()
				})

				document.addEventListener('keydown', function (e) {
					if (e.key === 'Escape' && modalOverlay.classList.contains('visible')) {
						closeModal()
					}
				})

				function validateForm() {
					clearFormErrors()
					var valid = true

					if (!formName.value.trim()) {
						document.getElementById('errName').classList.add('visible')
						valid = false
					}
					var lon = parseFloat(formLon.value)
					if (isNaN(lon) || lon < -180 || lon > 180) {
						document.getElementById('errLon').classList.add('visible')
						valid = false
					}
					var lat = parseFloat(formLat.value)
					if (isNaN(lat) || lat < -90 || lat > 90) {
						document.getElementById('errLat').classList.add('visible')
						valid = false
					}

					return valid
				}

				function collectFormPoint() {
					return {
						ID: editingPointId || getNextPointId(),
						Type: formType.value,
						Name: formName.value.trim(),
						Dept: formDept.value.trim(),
						Location: formLocation.value.trim(),
						Lon: parseFloat(formLon.value),
						Lat: parseFloat(formLat.value),
						Qty: parseInt(formQty.value) || 1,
						Power: formPower.value.trim(),
						Comm: formComm.value.trim(),
						Cond: formCond.value.trim(),
						Remark: formRemark.value.trim(),
					}
				}

				modalSave.addEventListener('click', function () {
					if (!validateForm()) return

					var point = collectFormPoint()

					if (editingPointId != null) {
						// Update working data
						var upArr = currentWorkingData[editingPointType]
						if (upArr) {
							for (var ui = 0; ui < upArr.length; ui++) {
								if (upArr[ui].ID === editingPointId) {
									Object.keys(point).forEach(function (k) {
										upArr[ui][k] = point[k]
									})
									break
								}
							}
						}
						// If type changed, move to new type array
						if (editingPointType !== point.Type) {
							if (!currentWorkingData[point.Type]) currentWorkingData[point.Type] = []
							currentWorkingData[point.Type].push(point)
							// Remove from old type
							var oldArr = currentWorkingData[editingPointType]
							if (oldArr) {
								for (var oi = 0; oi < oldArr.length; oi++) {
									if (oldArr[oi].ID === editingPointId) {
										oldArr.splice(oi, 1)
										break
									}
								}
							}
						}
					var desc = "修改点位 #" + editingPointId + " (" + point.Name + ")"
					// (update saved on session save)
						refreshLayerByType(editingPointType)
						if (editingPointType !== point.Type) {
							refreshLayerByType(point.Type)
						}
						selectPoint(point.Type, point, null)
						showToastMsg('✅ 点位已更新（尚未保存到版本）')
					} else {
						// Add to working data
						if (!currentWorkingData[point.Type]) currentWorkingData[point.Type] = []
						currentWorkingData[point.Type].push(point)
					// (new point saved on session save)
						if (typeNames.indexOf(point.Type) < 0) {
							typeNames.push(point.Type)
							typeNames.sort()
							updateLayerListUI()
						}
						refreshLayerByType(point.Type)
						selectPoint(point.Type, point, null)
						showToastMsg('✅ 点位已添加（尚未保存到版本）')
					}

					closeModal()
					editSessionSaved = false
					updateEditPanelHeader()
					renderVersionHistory()
					updateLayerListUI()
				})

				btnEditPoint.addEventListener('click', function () {
					if (!selectedPoint) return
					openEditForm(selectedPoint.typeName, selectedPoint.point)
				})

				btnDeletePoint.addEventListener('click', function () {
					if (!selectedPoint) return
					confirmMsgEl.textContent = '确定要删除点位 #' + selectedPoint.point.ID + '（' + selectedPoint.point.Name + '）吗？此操作不可撤销。'
					confirmOverlay.classList.add('visible')
				})

				// "调整位置" button — enters drag sub-mode
				var btnMovePoint = document.getElementById('btnMovePoint')
				if (btnMovePoint) {
					btnMovePoint.addEventListener('click', function () {
						if (!selectedPoint || dragSubMode) return
						if (viewedVersionId !== null) {
							showToastMsg('⚠ 请先返回当前版本', true)
							return
						}
						enterDragSubMode()
					})
				}

				addPointBtnEl.addEventListener('click', function () {
					if (viewedVersionId !== null) {
						showToastMsg('⚠ 请先返回当前版本', true)
						return
					}
					clearSelection()
					openAddForm(centerLon, centerLat)
				})

				// ================================================================
				//  Confirm Delete Dialog
				// ================================================================

				confirmCancel.addEventListener('click', function () {
					confirmOverlay.classList.remove('visible')
				})

				confirmOverlay.addEventListener('click', function (e) {
					if (e.target === confirmOverlay) confirmOverlay.classList.remove('visible')
				})

				confirmOk.addEventListener('click', function () {
					if (!selectedPoint) return
					var typeName = selectedPoint.typeName
					var point = selectedPoint.point
					// Remove from working data
					var delArr = currentWorkingData[typeName]
					if (delArr) {
						for (var di = 0; di < delArr.length; di++) {
							if (delArr[di].ID === point.ID) {
								delArr.splice(di, 1)
								break
							}
						}
					}
				var desc = "删除点位 #" + point.ID + " (" + point.Name + ")"
				// (deletion saved on session save)
					confirmOverlay.classList.remove('visible')
					clearSelection()
					refreshLayerByType(typeName)
					editSessionSaved = false
					updateEditPanelHeader()
					renderVersionHistory()
					updateLayerListUI()
					showToastMsg('✅ 点位已删除（尚未保存到版本）')
				})

				// ================================================================
				//  Version History UI
				// ================================================================

			function renderVersionHistory() {
				if (!versionIndex || !versionIndex.versions) {
					versionHistoryList.innerHTML = '<div class="version-empty">暂无版本记录<br><small style="color:var(--text-muted)">上传 .js 文件或编辑保存来创建新版本</small></div>'
					return
				}
				var versions = versionIndex.versions
				versionCountLabel.textContent = versions.length + ' 个版本'

				var html = ''
				for (var i = versions.length - 1; i >= 0; i--) {
					var v = versions[i]
					var isCurrent = v.id === currentVersionId && viewedVersionId === null
					var isViewing = viewedVersionId === v.id
					var cls = 'version-item'
					if (isCurrent) cls += ' active'
					if (isViewing) cls += ' historical'

					html += "<div class='" + cls + "' data-ver='" + v.id + "' data-file='" + v.file + "'>"
					html += "<div class='ver-header'><span class='ver-id'>V" + v.id + '</span>'
					html += "<span class='ver-time'>" + (v.timestamp || '') + '</span></div>'
					html += "<div class='ver-desc'>" + (v.label || '') + '</div>'
					html += "<span style='font-size:10px;color:var(--text-muted)'>共 " + (v.points || '?') + ' 个点位 &nbsp;|&nbsp; ' + v.file + '</span>'

					html += "<div class='ver-actions' style='margin-top:6px'>"

					if (isViewing) {
						html += "<span style='font-size:10px;color:var(--warning);display:inline-block;padding:3px 10px;border:1px solid rgba(251,191,36,0.3);border-radius:10px'>👁 正在查看</span>"
					} else if (isCurrent) {
						html += "<span style='font-size:10px;color:var(--accent);display:inline-block;padding:3px 10px'>● 当前版本</span>"
					}

					if (!isViewing && !isCurrent) {
						html += "<button class='btn-secondary btn-sm ver-view-btn'>👁 查看</button>"
						html += "<button class='btn-secondary btn-sm ver-set-current-btn' style='margin-left:4px'>★ 设为当前</button>"
						html += "<button class='btn-danger btn-sm ver-delete-btn' style='margin-left:4px'>✕ 删除</button>"
					}

					html += '</div></div>'
				}

				versionHistoryList.innerHTML = html

				// Bind view buttons
				versionHistoryList.querySelectorAll('.ver-view-btn').forEach(function (btn) {
					btn.addEventListener('click', function (e) {
						e.stopPropagation()
						var verId = parseInt(this.closest('.version-item').getAttribute('data-ver'))
						viewHistoricalVersion(verId)
					})
				})

				// Bind set-current buttons
				versionHistoryList.querySelectorAll('.ver-set-current-btn').forEach(function (btn) {
					btn.addEventListener('click', function (e) {
						e.stopPropagation()
						var verId = parseInt(this.closest('.version-item').getAttribute('data-ver'))
						if (confirm('确定将 V' + verId + ' 设为当前版本吗？')) {
							if (!versionIndex) return
							versionIndex.currentId = verId
							currentVersionId = verId
							// Save to localStorage cache
							try { localStorage.setItem('yuxi_uploaded_index', JSON.stringify(versionIndex)) } catch (e) {}
							viewHistoricalVersion(verId)
							restoreCurrentVersion()
							showToastMsg('✅ 已将 V' + verId + ' 设为当前版本')
						}
					})
				})
				// Bind delete buttons
				versionHistoryList.querySelectorAll('.ver-delete-btn').forEach(function (btn) {
					btn.addEventListener('click', function (e) {
						e.stopPropagation()
						var verId = parseInt(this.closest('.version-item').getAttribute('data-ver'))
						if (verId === 1) { showToastMsg('初始数据不可删除', true); return }
						if (verId === currentVersionId) { showToastMsg('不能删除当前版本', true); return }
						var v = findVersionById(verId)
						if (!v) return
						if (confirm('确定要删除版本 V' + verId + '（' + (v.label || v.file) + '）吗？此操作不可恢复。')) {
							// Remove from index
							versionIndex.versions = versionIndex.versions.filter(function (x) { return x.id !== verId })
							// Remove from localStorage cache
							try {
								localStorage.removeItem('yuxi_uploaded_data_' + verId)
								localStorage.setItem('yuxi_uploaded_index', JSON.stringify(versionIndex))
							} catch (e) {}
							renderVersionHistory()
							showToastMsg('已删除版本 V' + verId)
						}
					})
				})

			}
			function viewHistoricalVersion(versionId) {
				viewedVersionId = versionId
				clearSelection()

				// V1 = default point_data.js
				if (versionId === 1) {
					currentWorkingData = deepClone(pointData)
					showHistoryOnMap(currentWorkingData, versionId)
					return
				}

				// Try localStorage cache for uploaded versions
				var dataText = localStorage.getItem('yuxi_uploaded_data_' + versionId)
				if (dataText) {
					try {
						var match = dataText.match(/=\s*(\{[\s\S]*\})\s*;?\s*$/)
						if (match) {
							currentWorkingData = JSON.parse(match[1])
							showHistoryOnMap(currentWorkingData, versionId)
							return
						}
					} catch (e) {}
				}

				// Fallback: try fetching from web_data/ folder
				var v = findVersionById(versionId)
				if (v && v.file && v.file !== 'point_data.js') {
					loadVersionDataFile(v.file, function (data) {
						if (data) {
							currentWorkingData = data
							showHistoryOnMap(data, versionId)
						} else {
							showToastMsg('无法加载版本 V' + versionId, true)
						}
					})
					return
				}

				showToastMsg('未找到版本 V' + versionId + ' 的数据', true)
			}

			function showHistoryOnMap(data, versionId) {
				var histTypes = Object.keys(data).sort()
				histTypes.forEach(function (tn) {
					if (typeNames.indexOf(tn) < 0) typeNames.push(tn)
				})
				typeNames.sort()

				typeNames.forEach(function (tn) {
					var oldLayer = allLayers[tn]
					var wasVisible = oldLayer ? oldLayer.getVisible() : true
					if (oldLayer) sMap.removeLayer(oldLayer)

					var points = data[tn] || []
					var newLayer = new sol.SimplePointFeatureLayer({
						id: 'lyr_' + tn,
						data: points,
						dataType: sol.global.featureTypes.point,
						sourceType: 'json',
						dataLngName: 'Lon',
						dataLatName: 'Lat',
						styleFn: makePointStyle,
						declutter: 'separate',
						renderBuffer: 30,
						visible: wasVisible,
					})
					sMap.addLayer(newLayer)
					allLayers[tn] = newLayer
					layerVisible[tn] = wasVisible
				})

				var label = 'V' + versionId
				var v2 = findVersionById(versionId)
				if (v2) label = 'V' + versionId + ' · ' + (v2.label || '')
				bannerText.textContent = '正在查看历史版本：' + label + '（只读）'
				historyBanner.classList.add('visible')
				renderVersionHistory()
				updateLayerListUI()
			}
			function restoreCurrentVersion() {
				viewedVersionId = null
				var cv = findVersionById(currentVersionId)
				if (cv && cv.file !== 'point_data.js') {
					loadVersionDataFile(cv.file, function (data) {
						if (data) currentWorkingData = data
						refreshAllLayers()
						clearSelection()
						historyBanner.classList.remove('visible')
						renderVersionHistory()
						updateLayerListUI()
					})
				} else {
					currentWorkingData = deepClone(pointData)
					refreshAllLayers()
					clearSelection()
					historyBanner.classList.remove('visible')
					renderVersionHistory()
					updateLayerListUI()
				}
			}

			bannerRestoreBtn.addEventListener('click', restoreCurrentVersion)

				// ================================================================
				//  Layer List UI Update (refresh counts and items)
				// ================================================================

				function updateLayerListUI() {
					var currentData = getCurrentData()
					var items = layerListEl.querySelectorAll('.layer-item')
					items.forEach(function (item) {
						var typeName = item.getAttribute('data-type')
						if (!typeName) return
						var count = (currentData[typeName] || []).length
						var countEl = item.querySelector('.count')
						if (countEl) countEl.textContent = count
					})
					var totalCount = 0
					var typeCount = 0
					Object.keys(currentData).forEach(function (tn) {
						var c = (currentData[tn] || []).length
						if (c > 0) typeCount++
						totalCount += c
					})
					var titleSub = document.querySelector('.title-bar .sub')
					if (titleSub) {
						titleSub.textContent = 'WGS84 坐标系  |  ' + typeCount + ' 种设备类型  |  共 ' + totalCount + ' 个点位'
					}
				}

				// ================================================================
				//  Shared Toast Helper
				// ================================================================

				function showToastMsg(msg, isError) {
					toastEl.textContent = msg
					toastEl.classList.add('show')
					if (isError) {
						toastEl.classList.add('error')
					} else {
						toastEl.classList.remove('error')
					}
					clearTimeout(toastTimer)
					toastTimer = setTimeout(function () {
						toastEl.classList.remove('show')
						toastEl.classList.remove('error')
					}, 1800)
				}

				// ================================================================
			//  Startup — load version index, then initialize
			// ================================================================

			loadVersionIndex(function () {
				// If a non-default version was loaded, rebuild layers
				var cv = findVersionById(currentVersionId)
				if (cv && cv.file !== 'point_data.js') {
					refreshAllLayers()
					updateLayerListUI()
				}

				console.log('%c玉溪智慧水务点位图 %c初始化完成', 'font-size:16px;font-weight:bold;', 'font-size:12px;')
				var initTotal = countTotalPoints(currentWorkingData)
				var initTypes = 0
				Object.keys(currentWorkingData).forEach(function (tn) {
					if ((currentWorkingData[tn] || []).length > 0) initTypes++
				})
				var verCount = versionIndex ? versionIndex.versions.length : 1
				console.log('  设备类型: ' + initTypes + ' | 总点位: ' + initTotal)
				console.log('  版本数量: ' + verCount + ' | 当前版本: V' + currentVersionId + ' | 地图中心: [' + centerLon.toFixed(4) + ', ' + centerLat.toFixed(4) + ']')
				console.log('  底图: 天地图 (SOL addTdtLayer) | 坐标系: EPSG:4326')
				console.log('  点样式: SOL styleFn | 气泡: mouseMoveCall | 编辑模式: 文件版本管理')
			})
			})()
		</script>
	</body>
</html>
